<div class="game-switch" role="group" aria-label="Empire / E4K">
  @for (option of games; track option.value) {
    <button type="button" class="game-switch-option" [class.game-switch-option--on]="game() === option.value"
      [attr.aria-pressed]="game() === option.value" [disabled]="disabled()" (click)="select(option.value)">
      <i [class]="option.icon" aria-hidden="true"></i>
      <span>{{ option.label }}</span>
    </button>
  }
</div>
