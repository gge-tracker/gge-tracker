<app-layered-scene scene="lists" class="compare-scene" />
<div class="compare-page">
  <header class="compare-hero">
    <img class="compare-wordmark" src="/assets/brand/wordmark.webp" alt="GGE Tracker" width="525" height="89">
    <h1 class="compare-title">{{ 'Comparer' | translate }}</h1>
    <nav class="compare-subjects" [attr.aria-label]="'Comparer' | translate">
      @for (tab of subjectTabs; track tab.key) {
        <a class="compare-subject" [routerLink]="['/compare', tab.key]" [class.active]="subject() === tab.key"
          [attr.aria-current]="subject() === tab.key ? 'page' : null">
          <img [src]="tab.icon" alt="" width="24" height="24">
          <span>{{ tab.label | translate }}</span>
        </a>
      }
    </nav>
  </header>

  <section class="compare-arena">
    <app-compare-contender [side]="0" [subject]="subject()" [contender]="contenders()[0]"
      [loading]="loading()[0]" [error]="errors()[0]" (searchName)="searchName(0, $event)" (pickId)="pick(0, $event)"
      (clear)="clear(0)"></app-compare-contender>

    <div class="compare-versus">
      <span class="compare-scale" [class.is-idle]="tilt() === null" [style.--compare-tilt]="(tilt() ?? 0) + 'deg'"
        aria-hidden="true">
        <span class="compare-scale-beam">
          <img src="/assets/compare/scale-beam.webp" alt="" width="320" height="248">
          <span class="compare-scale-pan compare-scale-pan-a">
            <img src="/assets/compare/scale-pan-a.webp" alt="" width="320" height="248">
          </span>
          <span class="compare-scale-pan compare-scale-pan-b">
            <img src="/assets/compare/scale-pan-b.webp" alt="" width="320" height="248">
          </span>
        </span>
      </span>
      <button type="button" class="compare-swap" (click)="swap()" [disabled]="!ids()[0] && !ids()[1]"
        [attr.aria-label]="'Inverser' | translate" [title]="'Inverser' | translate">
        <lucide-icon [img]="ArrowLeftRight" [size]="18"></lucide-icon>
      </button>
    </div>

    <app-compare-contender [side]="1" [subject]="subject()" [contender]="contenders()[1]"
      [loading]="loading()[1]" [error]="errors()[1]" (searchName)="searchName(1, $event)" (pickId)="pick(1, $event)"
      (clear)="clear(1)"></app-compare-contender>
  </section>

  @if (rows(); as currentRows) {
    <app-compare-tape [rows]="currentRows" [names]="names()"></app-compare-tape>
    @if (isBrowser && readyIds(); as pairIds) {
      @if (subject() === 'players') {
        <app-compare-events [ids]="pairIds"></app-compare-events>
      }
      <section class="compare-charts" [class.compare-charts--single]="subject() === 'alliances'">
        <app-compare-might [subject]="subject()" [ids]="pairIds" [names]="names()"></app-compare-might>
        @if (subject() === 'players') {
          <app-compare-loot [ids]="pairIds" [names]="names()"></app-compare-loot>
        }
      </section>
    }
  } @else {
    <div class="compare-herald">
      <img class="compare-herald-king" src="/assets/compare/king.webp" alt="" width="292" height="440">
      <p class="compare-herald-text">{{ hint() | translate }}</p>
    </div>
  }
</div>
