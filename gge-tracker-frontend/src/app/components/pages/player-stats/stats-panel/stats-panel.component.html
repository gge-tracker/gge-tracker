<div class="bg-white p-1 rounded shadow stats-panel position-relative h-100" [style.--ps-accent]="accent()">
  <div class="text-center pt-3 stats-panel-head position-relative" [class.stats-panel-head--tinted]="hasBanner"
    [style.--ps-head-layer]="headLayer">
    <ng-content select="[head-before]"></ng-content>
    <h1 class="title">{{ title() }}</h1>
    <p class="text-light"><small>{{ subtitle() }}</small></p>
    <ng-content select="[head-after]"></ng-content>
  </div>
  <ng-content></ng-content>
</div>
