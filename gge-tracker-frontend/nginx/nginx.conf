# /etc/nginx/sites-available/default

map $http_user_agent $is_link_crawler {
    default 0;
    "~*(discordbot|facebookexternalhit|facebookcatalog|meta-externalagent|twitterbot|whatsapp|slackbot|slack-imgproxy|telegrambot|linkedinbot|redditbot|pinterest|skypeuripreview|vkshare|embedly|iframely|mastodon|bluesky|googlebot|google-inspectiontool|bingbot|duckduckbot|yandexbot|applebot|qwantify)" 1;
}

server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html/gge-tracker-frontend/browser;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    set $seo_backend "http://backend-container:3000";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(?<seo_subject>player|alliance)/(?<seo_id>[0-9]+)/?$ {
        add_header Vary User-Agent always;
        recursive_error_pages on;
        error_page 418 = @link_preview;
        if ($is_link_crawler) {
            return 418;
        }
        rewrite ^ /index.html break;
    }

    location @link_preview {
        proxy_pass $seo_backend/api/v1/seo/$seo_subject/$seo_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @spa;
        add_header Vary User-Agent always;
    }

    location @spa {
        add_header Vary User-Agent always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location /sitemaps/ {
        allow all;
        log_not_found off;
        access_log off;
    }

    error_page 404 /index.html;
}
