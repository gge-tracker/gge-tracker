# /etc/nginx/sites-available/default

map $http_user_agent $is_link_crawler {
    default 0;
    "~*(discordbot|facebookexternalhit|facebookcatalog|meta-externalagent|twitterbot|whatsapp|slackbot|slack-imgproxy|telegrambot|linkedinbot|redditbot|pinterest|skypeuripreview|vkshare|embedly|iframely|mastodon|bluesky|googlebot|google-inspectiontool|bingbot|duckduckbot|yandexbot|applebot|qwantify)" 1;
}

map $http_user_agent $is_search_crawler {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|duckduckbot|yandexbot|applebot|qwantify)" 1;
}

map $uri $is_spa_route {
    default 0;
    "~^/(maintenance|release-notes|players|guess|alliances|compare|dungeons|map|statistics|movements|renames|about|legal|privacy|offers|grand-tournament|event-thresholds|rift-raid|stormy-isles|storm-tracker|woa|events|castles|live/outer-realms)/?$" 1;
    "~^/(player|alliance|compare|map|renames|woa|events|live/outer-realms)/[^/]+/?$" 1;
    "~^/events/[^/]+/[^/]+/?$" 1;
}

map $uri $seo_page {
    default "";
    "/" "/";
    "~^(?<seo_page_path>/(players|alliances|compare/players|compare/alliances|event-thresholds|statistics|map|castles|movements|renames/players|renames/alliances|dungeons|storm-tracker|stormy-isles|rift-raid|grand-tournament|events|live/outer-realms|woa|offers|guess|about|release-notes|legal|privacy))/?$" $seo_page_path;
}

server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html/gge-tracker-frontend/browser;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    set $seo_backend "http://backend-container:3000";

    location = / {
        add_header Vary User-Agent always;
        recursive_error_pages on;
        error_page 418 = @page_preview;
        set $page_preview_wanted "$is_link_crawler$is_search_crawler:$seo_page";
        if ($page_preview_wanted ~ "^10:/") {
            return 418;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri @spa_route;
    }

    location @spa_route {
        add_header Vary User-Agent always;
        recursive_error_pages on;
        error_page 404 /index.html;
        error_page 418 = @page_preview;
        if ($is_spa_route = 0) {
            return 404;
        }
        set $page_preview_wanted "$is_link_crawler$is_search_crawler:$seo_page";
        if ($page_preview_wanted ~ "^10:/") {
            return 418;
        }
        try_files /index.html =404;
    }

    location @page_preview {
        proxy_pass $seo_backend/api/v1/seo/page?path=$seo_page&event=$arg_event;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @spa;
        add_header Vary User-Agent always;
    }

    location ~ ^/(?<seo_subject>player|alliance)/(?<seo_id>[0-9]+)/?$ {
        add_header Vary User-Agent always;
        recursive_error_pages on;
        error_page 418 = @link_preview;
        if ($is_link_crawler) {
            return 418;
        }
        rewrite ^ /index.html break;
    }

    location @link_preview {
        proxy_pass $seo_backend/api/v1/seo/$seo_subject/$seo_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @spa;
        add_header Vary User-Agent always;
    }

    location @spa {
        add_header Vary User-Agent always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location /sitemaps/ {
        allow all;
        log_not_found off;
        access_log off;
    }

    error_page 404 /index.html;
}
