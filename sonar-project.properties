sonar.projectKey=gge-tracker_gge-tracker
sonar.organization=gge-tracker

sonar.sources=.

# Test harnesses: analysed as tests, not as production source. They run against a
# live fixture stack and never ship, so taint analysis on them reports attacker
# paths that do not exist.
sonar.tests=empire-api/tests,gge-tracker-backend-api/tests

# database/          SQL fixtures and dumps
# gge-tracker-tools/ local developer scripts
# gge-tracker-fetcher/ deployed and analysed as its own Cloudflare Worker project
# monitoring/        Grafana/Prometheus provisioning and ops shell, not product code
sonar.exclusions=database/**,gge-tracker-tools/**,gge-tracker-fetcher/**,monitoring/**,\
  empire-api/tests/**,gge-tracker-backend-api/tests/**,\
  **/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js

sonar.cpd.exclusions=**/eslint.config.*,\
  **/temp-server-events.config.ts,**/temporary-server-events.config.ts,\
  **/release-notes.component.ts

sonar.javascript.node.maxspace=8192

sonar.issue.ignore.multicriteria=cssContrast
sonar.issue.ignore.multicriteria.cssContrast.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.cssContrast.resourceKey=**/*
