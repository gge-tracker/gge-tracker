apiVersion: 1

groups:
  - orgId: 1
    name: scraping
    folder: Scraping
    interval: 1m
    rules:
      - uid: scraping-error
        title: Scraping error
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server, identifier, msg) (count_over_time({service="internal-scraping", level="error", event!="run_summary"} | json [5m]))'
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: '{{ with $labels.identifier }}`#{{ . }}` {{ end }}{{ $labels.msg }}'
      - uid: scraping-stopped
        title: Scraping stopped
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service="internal-scraping", event="run_summary"}[2h])) or vector(0)'
          - refId: B
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: No scraping run has completed in the last 2 hours.
          action: Check the fill crons on the host and that the empire-api bridge answers.
          dashboard: /d/scraping-jobs
          dashboard_title: Scraping jobs
      - uid: scraping-digest
        title: Scraping hourly report
        condition: D
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service="internal-scraping", event="run_summary"}[1h])) or vector(0)'
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: B
              editorMode: code
              queryType: instant
              expr: 'count(count by (server) (count_over_time({service="internal-scraping", event="run_summary"}[1h]))) or vector(0)'
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: C
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service="internal-scraping", level="error"}[1h])) or vector(0)'
          - refId: D
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: D
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1] }
                  operator: { type: and }
                  query: { params: [D] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          notify: digest
        annotations:
          runs: '{{ $values.A }}'
          servers: '{{ $values.B }}'
          errors: '{{ $values.C }}'
      - uid: loot-wraps-refused
        title: Loot wraps refused
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server) (count_over_time({service="internal-scraping", event="loot_counters", level="warn"}[5m]))'
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'More than 50 players would have gained 2^32 in one run, nothing was added.'
          action: Check the reset declared for this server in servers.xml.
          dashboard: '/d/loot-counters?var-server={{ $labels.server }}'
          dashboard_title: Loot counters
      - uid: loot-decrease
        title: Loot decreased mid-week
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server) (sum_over_time({service="internal-scraping", event="loot_counters"} | json decreased="decreased" | unwrap decreased [5m]))'
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: warning
          notify: discord
        annotations:
          summary: '{{ $values.A }} player(s) lost loot points mid-week.'
          dashboard: '/d/loot-counters?var-server={{ $labels.server }}'
          dashboard_title: Loot counters
      - uid: loot-reset-mismatch
        title: Loot reset not where declared
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server, msg) (count_over_time({service="internal-scraping", event="loot_reset_check", level="warn"} | json msg="msg" [5m]))'
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: '{{ $labels.msg }}'
          action: Measure the server again with npm run test:api:reset-offset, then fix its reset in servers.xml.
          dashboard: '/d/loot-counters?var-server={{ $labels.server }}'
          dashboard_title: Loot counters
      - uid: loot-reset-check-missing
        title: Loot reset check not running
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service="internal-scraping", event="loot_reset_check_summary", level="info"}[26h])) or vector(0)'
          - refId: B
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: The daily loot reset check has not completed in 26 hours.
          action: 'Install its daily cron on the host: gge-tracker-internal-scraping/scripts/run-docker-loot-reset-check.sh.'
          dashboard: /d/loot-counters
          dashboard_title: Loot counters
      - uid: loot-hourly-jump
        title: Loot jump over 3.5 billion
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              queryType: table
              rawSql: |-
                SELECT replaceRegexpOne(_db, '^(empire_ranking_|ggetracker_)', '') AS server, toFloat64(count()) AS jumps
                FROM (
                  SELECT _database AS _db, point - lagInFrame(point) OVER w AS gain, dateDiff('minute', lagInFrame(created_at) OVER w, created_at) AS minutes
                  FROM merge(REGEXP('^(empire_ranking|ggetracker_)'), '^player_loot_history$')
                  WHERE created_at >= now() - INTERVAL 3 HOUR
                  WINDOW w AS (PARTITION BY _database, player_id ORDER BY created_at ROWS BETWEEN 1 PRECEDING AND CURRENT ROW))
                WHERE minutes BETWEEN 1 AND 70 AND gain > 3500000000
                GROUP BY server
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'A stored loot score rose by more than 3.5 billion in one hour'
          action: The tracker probably added 2^32 by mistake, see the loot_counters records of this server.
          dashboard: '/d/loot-counters?var-server={{ $labels.server }}'
          dashboard_title: Loot counters
      - uid: account-disconnected-realtime
        title: Game account disconnected (realtime)
        condition: B
        for: 4m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 360, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server, zone, task) (count_over_time({service="internal-scraping", event="account_disconnected"} | json bridge="bridge", zone="zone", task="job" | bridge="realtime" [6m]))'
          - refId: B
            relativeTimeRange: { from: 360, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'The {{ $labels.task }} skips this server: its account `{{ $labels.zone }}` is disconnected on the realtime bridge.'
          action: 'The bridge retries on its own after 3, 5, 20 then every 30 minutes. POST /server/{{ $labels.zone }}/reconnect on the realtime bridge retries at once.'
          dashboard: /d/empire-api-bridge?var-bridge=realtime
          dashboard_title: Empire-API bridge
      - uid: account-disconnected-fill
        title: Game account disconnected (hourly fill)
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 3900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server, zone, task) (count_over_time({service="internal-scraping", event="account_disconnected"} | json bridge="bridge", zone="zone", task="job" | bridge="standard" [65m]))'
          - refId: B
            relativeTimeRange: { from: 3900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'The hourly fill was skipped: its account `{{ $labels.zone }}` stayed disconnected on the standard bridge for the whole 8-minute wait.'
          action: 'Rankings, players and alliances of this server are not updated until it reconnects. POST /server/{{ $labels.zone }}/reconnect on the standard bridge retries at once.'
          dashboard: /d/empire-api-bridge?var-bridge=standard
          dashboard_title: Empire-API bridge
      - uid: bridge-command-dead
        title: Game command never answered
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: 'sum by (bridge, command) (increase(empire_api_commands_total{command=~"jca|gdi", outcome="timeout"}[3h])) >= 5 unless on (bridge, command) sum by (bridge, command) (increase(empire_api_commands_total{command=~"jca|gdi", outcome="ok"}[1h])) > 0'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'Every `{{ $labels.command }}` sent through the {{ $labels.bridge }} bridge times out while its sockets stay connected: castle pages answer 504.'
          action: 'Restart the {{ $labels.bridge }} bridge container. The socket status cannot see this: on 2026-10-26 jca failed for 2.5 days with every socket connected.'
          dashboard: '/d/empire-api-bridge?var-bridge={{ $labels.bridge }}'
          dashboard_title: Empire-API bridge
      - uid: kingdoms-league-missed
        title: Kingdoms League night missed
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (server, failureReason) (count_over_time({job="kingdoms-league", level="error"} | json server="server", failureReason="failureReason" [5m]))'
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: warning
          notify: discord
        annotations:
          summary: 'The last fill of the night could not read the Kingdoms League ranking: {{ $labels.failureReason }}'
          action: 'Read it by hand before 09:00 Paris'
          dashboard: /d/scraping-jobs
          dashboard_title: Scraping jobs
  - orgId: 1
    name: platform
    folder: Platform
    interval: 5m
    rules:
      - uid: db-backup-failed
        title: Database backup failed
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 90000, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (step) (count_over_time({event="db_backup", level="error"} | json step="step" [25h]))'
          - refId: B
            relativeTimeRange: { from: 90000, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: 'The nightly database backup failed at step `{{ $labels.step }}`.'
          action: 'The reason is in the last line of: docker logs db-backup --tail 20'
          dashboard: /alerting/list
          dashboard_title: Alert rules
      - uid: db-backup-missing
        title: No database backup in 26 hours
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({event="db_backup", level="info"} |= "\"status\":\"success\"" [26h])) or vector(0)'
          - refId: B
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: critical
          notify: discord
        annotations:
          summary: No database backup has completed in 26 hours.
          action: 'Check that the db-backup container is running: docker logs db-backup --tail 20'
          dashboard: /alerting/list
          dashboard_title: Alert rules
      - uid: api-client-backend-share
        title: One client takes most of the backend time
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              queryType: table
              rawSql: |-
                WITH
                  replaceRegexpOne(trim(splitByChar(',', ip)[1]), '^::ffff:', '') AS client_ip,
                  if(isIPv6String(client_ip), concat(cutIPv6(IPv6StringToNum(client_ip), 8, 0), '/64'), client_ip) AS client,
                  (SELECT sum(response_time) FROM logs.logs WHERE timestamp >= now() - INTERVAL 1 HOUR AND job = 'ggetracker-api') AS total_ms
                SELECT client, toFloat64(round(100 * sum(response_time) / total_ms)) AS share_pct
                FROM logs.logs
                WHERE timestamp >= now() - INTERVAL 1 HOUR AND job = 'ggetracker-api' AND partner = '' AND client_ip != '127.0.0.1'
                GROUP BY client
                HAVING sum(response_time) >= 300000 AND sum(response_time) > 0.3 * total_ms
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: warning
          notify: discord
        annotations:
          summary: 'One anonymous client used {{ $values.B.Value }}% of the backend time over the last hour.'
          action: See "Top clients by backend time" in the Rate limiting row.
          dashboard: /d/dashboard-log-backend-clickhouse
          dashboard_title: API monitoring
      - uid: api-client-daily-requests
        title: One client sent over 100k requests in a day
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              queryType: table
              rawSql: |-
                WITH
                  replaceRegexpOne(trim(splitByChar(',', ip)[1]), '^::ffff:', '') AS client_ip,
                  if(isIPv6String(client_ip), concat(cutIPv6(IPv6StringToNum(client_ip), 8, 0), '/64'), client_ip) AS client
                SELECT client, toFloat64(count()) AS requests
                FROM logs.logs
                WHERE timestamp >= now() - INTERVAL 1 DAY AND job = 'ggetracker-api' AND partner = '' AND client_ip != '127.0.0.1'
                GROUP BY client
                HAVING requests > 100000
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: threshold
        labels:
          severity: warning
          notify: discord
        annotations:
          summary: 'One anonymous client sent {{ $values.B.Value }} requests in the last 24 hours.'
          action: See "Top clients by backend time" in the Rate limiting row.
          dashboard: /d/dashboard-log-backend-clickhouse
          dashboard_title: API monitoring
