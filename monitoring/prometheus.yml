global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node'
    scrape_interval: 3s
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'cadvisor'
    scrape_interval: 3s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'cloudflare'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['cloudflare-exporter:8080']
  - job_name: 'cloudflare-zone'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['cloudflare-zone-exporter:8081']
